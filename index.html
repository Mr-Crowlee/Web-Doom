<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=11">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Web-Doom (IE11)</title>
    <link rel="icon" type="image/x-icon" href="https://www.iconarchive.com/download/i597/3xhumed/mega-games-pack-26/Doom-The-Ultimate-1.ico">
    <style type="text/css">
      html, body { margin: 0; padding: 0; overflow: hidden; background: #111; color: #ddd; font-family: Tahoma, Arial, sans-serif; }
      #wrap { text-align: center; padding: 8px; }
      .dosbox-container { width: 640px; margin: 0 auto; }
      .dosbox-canvas {
        image-rendering: pixelated;
        -ms-interpolation-mode: nearest-neighbor;
      }
      .dosbox-container > .dosbox-overlay { background: url(https://js-dos.com/cdn/DOOM.png); }
      #ie-warning {
        display: none;
        max-width: 640px;
        margin: 0 auto 12px auto;
        padding: 10px;
        background: #600;
        color: #fff;
      }
      #hint { font-size: 12px; max-width: 640px; margin: 8px auto; }
    </style>
  </head>
  <body>
    <div id="ie-warning"></div>
    <div id="wrap">
    <div id="dosbox"></div>
    <div id="hint">
      Clique no jogo para focar o teclado. Setas / Ctrl / Espaco. Ctrl+F12 acelera, Ctrl+F11 reduz CPU.
      <br/>
      <button type="button" onclick="toggleFullscreen();">Tela cheia</button>
    </div>
    </div>

    <script type="text/javascript" src="vendor/ie-shims.js"></script>
    <script type="text/javascript" src="vendor/js-dos-api.js"></script>
    <script type="text/javascript">
      (function () {
        var warn = document.getElementById("ie-warning");
        var mode = document.documentMode;
        var ua = navigator.userAgent || "";
        var compatUa = ua.indexOf("MSIE 7.0") !== -1 && ua.indexOf("Trident/") !== -1;

        if (mode && mode < 10) {
          warn.style.display = "block";
          warn.innerHTML =
            "Este IE está em documentMode " + mode +
            " (user-agent de compatibilidade). O DOSBox precisa de modo IE10/IE11. " +
            "Desmarque Exibir sites da Intranet em Modo de Exibição de Compatibilidade " +
            "e recarregue. Ferramentas &gt; Opções da Internet &gt; Avançado / Compatibilidade.";
          return;
        }

        if (compatUa && (!mode || mode >= 10)) {
          warn.style.display = "block";
          warn.style.background = "#333";
          warn.innerHTML =
            "IE11 em vista de compatibilidade, documentMode " +
            (mode || "?") +
            ". Motor Trident 7 com APIs de IE11 — o jogo tenta rodar (sem som).";
        }

        if (typeof Dosbox === "undefined" || typeof Uint8Array === "undefined") {
          warn.style.display = "block";
          warn.innerHTML = "Faltam APIs (Uint8Array/Dosbox). Não é possível iniciar o emulador neste modo.";
          return;
        }

        var cycles = 10000;
        var cycleMatch = /[?&]cycles=(\d+)/.exec(window.location.search || "");
        if (cycleMatch) {
          cycles = parseInt(cycleMatch[1], 10);
        }

        window.dosbox = new Dosbox({
          id: "dosbox",
          archiveUrl: "https://js-dos.com/cdn/upload/DOOM-@evilution.zip",
          executable: "./DOOM/DOOM.EXE",
          cycles: cycles,
          onload: function (dosbox) {
            dosbox.run();
          },
          onrun: function (dosbox, app) {
            if (window.console && console.log) {
              console.log("App '" + app + "' is running");
            }
          }
        });
      })();

      function toggleFullscreen() {
        var el = document.getElementById("dosbox");
        var req = el.requestFullscreen || el.msRequestFullscreen ||
          el.mozRequestFullScreen || el.webkitRequestFullscreen;
        if (req) {
          req.call(el);
        } else if (window.dosbox && dosbox.requestFullScreen) {
          dosbox.requestFullScreen();
        } else {
          alert("Tela cheia não suportada neste modo do IE.");
        }
      }
    </script>
  </body>
</html>
